name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Force test auth mode; load_dotenv must not override these (override=False).
  AUTH_MODE: dev
  APP_ENV: test
  AUTH_JWT_SECRET: ci-test-jwt-secret-not-for-production  # pragma: allowlist secret
  ANTHROPIC_API_KEY: ""
  # Dummy DSN for unit tests that only need the var present; pool is mocked.
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci  # pragma: allowlist secret

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refuse accidental .env in CI
        run: |
          if [ -f .env ]; then
            echo "::error::.env must not be present in CI checkout"
            exit 1
          fi

      - name: Run backend unit suite
        run: python -m unittest discover -s tests -v
        env:
          AUTH_MODE: dev
          APP_ENV: test
          AUTH_JWT_SECRET: ci-test-jwt-secret-not-for-production  # pragma: allowlist secret
          ANTHROPIC_API_KEY: ""
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci  # pragma: allowlist secret
          # Live migration repro is a separate job; keep it skipped here.
          RUN_MIGRATION_REPRO_TEST: "0"

  migration-repro:
    name: Migration reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
          POSTGRES_DB: lifesight_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifesight_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifesight_ci  # pragma: allowlist secret
      RUN_MIGRATION_REPRO_TEST: "1"
      AUTH_MODE: dev
      APP_ENV: test
      AUTH_JWT_SECRET: ci-test-jwt-secret-not-for-production  # pragma: allowlist secret
      ANTHROPIC_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refuse accidental .env in CI
        run: |
          if [ -f .env ]; then
            echo "::error::.env must not be present in CI checkout"
            exit 1
          fi

      - name: Apply migrations (smoke apply)
        run: python scripts/ci_apply_migrations.py --prepare-auth-stub

      - name: Recreate empty database for end-to-end repro test
        env:
          PGPASSWORD: postgres  # pragma: allowlist secret
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          SELECT pg_terminate_backend(pid)
          FROM pg_stat_activity
          WHERE datname = 'lifesight_ci' AND pid <> pg_backend_pid();
          DROP DATABASE lifesight_ci;
          CREATE DATABASE lifesight_ci;
          SQL

      - name: Verify schema, MODE_REGISTRY modes, and unknown-mode rejection
        run: python -m unittest tests.test_migration_repro.LiveMigrationReproTests -v
