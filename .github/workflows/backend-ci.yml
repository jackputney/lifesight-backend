name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Force test auth mode; load_dotenv must not override these (override=False).
  AUTH_MODE: dev
  APP_ENV: test
  AUTH_JWT_SECRET: ci-test-jwt-secret-not-for-production  # pragma: allowlist secret
  ANTHROPIC_API_KEY: ""
  # Dummy DSN for unit tests that only need the var present; pool is mocked.
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci  # pragma: allowlist secret

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refuse accidental .env in CI
        run: |
          if [ -f .env ]; then
            echo "::error::.env must not be present in CI checkout"
            exit 1
          fi

      - name: Run backend unit suite
        run: python -m unittest discover -s tests -v
        env:
          AUTH_MODE: dev
          APP_ENV: test
          AUTH_JWT_SECRET: ci-test-jwt-secret-not-for-production  # pragma: allowlist secret
          ANTHROPIC_API_KEY: ""
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci  # pragma: allowlist secret
          RUN_MIGRATION_REPRO_TEST: "0"

  migration-repro:
    name: Migration reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
          POSTGRES_DB: lifesight_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lifesight_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lifesight_ci  # pragma: allowlist secret
      RUN_MIGRATION_REPRO_TEST: "1"
      AUTH_MODE: dev
      APP_ENV: test
      AUTH_JWT_SECRET: ci-test-jwt-secret-not-for-production  # pragma: allowlist secret
      ANTHROPIC_API_KEY: ""
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refuse accidental .env in CI
        run: |
          if [ -f .env ]; then
            echo "::error::.env must not be present in CI checkout"
            exit 1
          fi

      - name: Apply migrations on empty database
        run: python scripts/ci_apply_migrations.py --prepare-auth-stub

      - name: Recreate empty database for end-to-end repro test
        env:
          PGPASSWORD: postgres  # pragma: allowlist secret
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          # Separate -c calls: DROP DATABASE cannot run inside a multi-statement transaction.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c \
            "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'lifesight_ci' AND pid <> pg_backend_pid();"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE lifesight_ci;"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE lifesight_ci;"

      - name: Verify schema, FKs, MODE_REGISTRY modes, unknown-mode rejection
        run: python -m unittest tests.test_migration_repro -v

      # Executes the guarantees the offline suite can only assert as file text:
      # append-only author captures, human-gated prompt proposals, health
      # dedupe. Uses its own scratch database so it cannot disturb the step
      # above, which requires an empty schema.
      - name: Enforce database-level safety invariants
        env:
          RUN_LIVE_DB_INVARIANTS: "1"
        run: python -m unittest tests.test_live_db_invariants -v

      - name: Dump schema diagnostics on failure
        if: failure()
        env:
          PGPASSWORD: postgres  # pragma: allowlist secret
        run: |
          echo "::group::public tables"
          psql -h localhost -U postgres -d lifesight_ci -c "\dt public.*" || true
          echo "::endgroup::"
          echo "::group::mode CHECK constraints"
          psql -h localhost -U postgres -d lifesight_ci -c "
            SELECT conname, pg_get_constraintdef(oid)
            FROM pg_constraint
            WHERE conname LIKE '%mode%check%'
            ORDER BY conname;
          " || true
          echo "::endgroup::"
          echo "::group::auth/author foreign keys"
          psql -h localhost -U postgres -d lifesight_ci -c "
            SELECT c.conname, cl.relname AS table_name, pg_get_constraintdef(c.oid)
            FROM pg_constraint c
            JOIN pg_class cl ON cl.oid = c.conrelid
            JOIN pg_namespace ns ON ns.oid = cl.relnamespace
            WHERE c.contype = 'f'
              AND ns.nspname = 'public'
              AND cl.relname IN (
                'users', 'auth_sessions', 'conversations',
                'author_projects', 'author_documents', 'author_document_versions'
              )
            ORDER BY cl.relname, c.conname;
          " || true
          echo "::endgroup::"
